<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Sal Vulcano</title>
  <style>
    body {
      background: #66ccff;
      color: #000080;
      font-family: "Comic Sans MS", "Comic Sans", cursive;
      text-align: center;
      margin: 0;
      padding: 16px;
    }
    table {
      margin: 0 auto;
      background: #ffff99;
      border: 6px ridge #ff00ff;
      padding: 12px;
      width: 640px;
      max-width: 100%;
    }
    h1 { color: #ff0000; font-size: 42px; margin: 8px 0; }
    h2 { color: #0000ff; font-size: 22px; margin-top: 0; }
    img { border: 4px solid #000; margin: 12px auto; display: block; max-width: 90%; }
    p { font-size: 18px; }
    input, button { font-family: "Comic Sans MS", cursive; font-size: 16px; padding: 6px; }
    button { background: #00ff00; border: 3px outset #ccc; cursor: pointer; }
    #count { color: #ff0000; font-size: 22px; }
    marquee { background: #ff00ff; color: #ffff00; font-weight: bold; }
    footer { margin-top: 16px; font-size: 14px; color: #333; }
  </style>
</head>
<body>
 <marquee>I fist fought that Turkish hand model!</marquee>
  <br>
  <table>
    <tr><td>
      <h1>Sal Vulcano</h1>
      <h2>Friend, Punching Bag &amp; Professional Worst</h2>
      <img src="sal1.jpg" alt="Sal">
      <p>Toot toot, motherfer!</p>
      <p>Please enter your name to support him.</p>
      <form id="support">
        <input id="name" type="text" placeholder="Your name" required>
        <button type="submit">Support Sal</button>
      </form>
      <p>Signups so far: <span id="count">0</span></p>
      <img src="sal2.webp" alt="Sal again">
      <footer>This is not a real website. It is a joke about a comedian. Sal Vulcano is not involved. No money is collected.</footer>
    </td></tr>
  </table>
  <script>
    const key = "support-count";
    const countEl = document.getElementById("count");
    let n = Number(localStorage.getItem(key) || 18420);
    countEl.textContent = n;
    document.getElementById("support").addEventListener("submit", (e) => {
      e.preventDefault();
      n += 1;
      localStorage.setItem(key, n);
      countEl.textContent = n;
      document.getElementById("name").value = "";
      alert("Supported. He is still the worst.");
    });
  </script>
</body>
</html>
